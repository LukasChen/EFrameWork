# EFrame AI rule registry draft.
# Maintainer-only. Do not sync this file to business projects.

schemaVersion: 0.1
status: draft
updatedAt: 2026-05-05
sourceInventory: ../AI_RULE_INVENTORY.md
notes:
  - This registry is a structured draft of existing rules, not yet a generator source.
  - Existing AIWorkspace files remain the active synced outputs until a later migration explicitly adopts generation.
  - Platform outputs must render or reference these rules; they must not become independent rule sources.

domains:
  governance: Sync boundaries, ownership, release responsibilities, and project custom rules.
  startup: Startup, procedure state, context access, lifecycle, cameras, and bootstrap.
  ui: Business UI contract, generated views, controller lifecycle, prefab-first layout, and framework internals boundary.
  resources: Addressables, ResPath, asset handles, preload, release, and managed resources.
  directory: App/module ownership, generated code, scenes, resources, and naming placement.
  data: Persistent data tables, events, save/load, migration, and dirty tracking.
  editor: Editor tooling, Unity YAML edits, generated assets, and compile validation.
  workflow: Skill routing, audit, sync, release, and platform output flow.

renderingLevels:
  full: The platform output may include the full canonical text.
  summary: The platform output may include a short restatement with no new semantics.
  checklist: The platform output may turn the rule into a verification question.
  handoff: The platform output should point to another rule view or skill.
  api-note: The platform output may mention the API entry and short use/avoid guidance.
  none: The rule must not appear in that output.

